version: "3.8"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "15432:15432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
      POSTGRES_PORT: 15432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase -p 15432"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -p 15432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
